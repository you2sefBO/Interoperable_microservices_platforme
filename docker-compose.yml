services:
  # --- 1. Service Mobilité (REST) ---
  service-mobilite:
    build: ./service-mobilite
    ports:
      - "5001:5001"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3307/db_mobilite?useSSL=false&allowPublicKeyRetrieval=true
      
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD= 
      
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_SHOW_SQL=true
    networks:
      - smartcity-net

  # --- 2. Service Qualité Air (SOAP) ---
  service-qualite-air:
    build: ./service-qualite-air
    ports:
      - "5002:5002"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3307/db_qualite_air?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - smartcity-net

  # --- 3. Service Urgences (gRPC) ---
  service-urgences:
    build: ./service-urgences
    ports:
      - "50051:50051"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3307/db_urgences?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - GRPC_SERVER_PORT=50051
    networks:
      - smartcity-net

  # --- 4. Service Événements (GraphQL) ---
  service-evenements:
    build: ./service-evenements
    ports:
      - "5004:5004"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3307/db_evenements?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    networks:
      - smartcity-net

  # --- 5. Service Orchestrateur (REST Client) ---
  service-orchestrateur:
    build: ./service-orchestrateur
    ports:
      - "5005:5005"
    environment:
      - APP_URL_MOBILITE=http://service-mobilite:5001
      - APP_URL_QUALITEAIR=http://service-qualite-air:5002/ws
      - APP_URL_EVENEMENTS=http://service-evenements:5004/graphql
      - APP_URL_URGENCES_HOST=172.18.0.6 
      - APP_URL_URGENCES_PORT=50051
    depends_on:
      - service-mobilite
      - service-qualite-air
      - service-evenements
    networks:
      - smartcity-net

  # --- 6. API Gateway (Point d'entrée unique) ---
  api-gateway:
    build: ./api-gateway
    ports:
      - "8888:8888"
    depends_on:
      - service-orchestrateur
    networks:
      - smartcity-net

networks:
  smartcity-net:
    driver: bridge